name: Lean specification

on:
  push:
    branches: [main]
    paths:
      - 'formal/**'
      - '.github/workflows/lean.yml'
  pull_request:
    paths:
      - 'formal/**'
      - '.github/workflows/lean.yml'

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install pinned elan
        run: |
          curl --fail --location --retry 3 \
            https://github.com/leanprover/elan/releases/download/v4.1.2/elan-x86_64-unknown-linux-gnu.tar.gz \
            --output /tmp/elan.tar.gz
          mkdir /tmp/elan-installer
          tar -xzf /tmp/elan.tar.gz -C /tmp/elan-installer
          /tmp/elan-installer/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Build and audit
        working-directory: formal
        run: |
          lake env lean --version
          lake build
          lake env lean Audit.lean | tee audit.log
          if grep -q 'sorryAx' audit.log; then exit 1; fi
